<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Krengel Marketing · Logo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,200..900,0..100;1,9..144,200..900,0..100&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3" />
<style>
  body { padding: 60px var(--pad); min-height: 100vh; }
  .showcase {
    max-width: 1100px; margin: 0 auto;
    display: grid; gap: 56px;
  }
  .lockup {
    border: 1px solid var(--line-2);
    padding: 80px 60px;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper);
    border-radius: 10px;
    position: relative;
  }
  .lockup.dark { background: var(--ink); border-color: var(--ink); }
  .lockup-label {
    position: absolute; top: 16px; left: 20px;
    font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  .lockup.dark .lockup-label { color: var(--dark-soft); }

  /* Icon-only mark, big */
  .mark-only svg { width: 260px; height: 260px; }

  /* Horizontal wordmark lockup */
  .wordmark {
    display: inline-flex; align-items: center; gap: 18px;
    font-family: var(--f-display);
    font-size: 88px; font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-variation-settings: "opsz" 144, "SOFT" 50;
  }
  .wordmark svg { width: 96px; height: 96px; }
  .wordmark .r { font-family: var(--f-mono); font-size: 18px; vertical-align: super; color: var(--ink-soft); margin-left: 4px; }
  .dark .wordmark { color: var(--bg); }
  .dark .wordmark .r { color: var(--dark-soft); }

  /* Inverted (white K on dark) */
  .mark-only.dark svg path[stroke="currentColor"] { stroke: var(--bg); }
  .wordmark.dark svg path[stroke="currentColor"] { stroke: var(--bg); }

  /* Stacked variant — wordmark below mark */
  .stacked {
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .stacked svg { width: 170px; height: 170px; }
  .stacked .name {
    font-family: var(--f-display); font-weight: 400; font-size: 56px;
    letter-spacing: -0.02em; color: var(--ink);
    font-variation-settings: "opsz" 144, "SOFT" 50;
  }
  .dark .stacked .name { color: var(--bg); }
  .dark .stacked svg path[stroke="currentColor"] { stroke: var(--bg); }

  .page-h {
    font-family: var(--f-display); font-weight: 350;
    font-size: clamp(40px, 5vw, 64px); line-height: 1; letter-spacing: -.03em;
    margin-bottom: 36px;
    font-variation-settings: "opsz" 144, "SOFT" 30;
  }
  .page-h em { font-style: italic; color: var(--accent); }
  .meta {
    font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="showcase">
  <header>
    <span class="meta">Brand mark</span>
    <h1 class="page-h">Krengel Marketing<br/><em>the logo.</em></h1>
  </header>

  <!-- Icon-only mark, light -->
  <div class="lockup mark-only">
    <span class="lockup-label">Primary mark · light</span>
    <svg viewBox="0 0 32 32" fill="none" aria-label="Krengel Marketing">
      <path d="M9.5 6 V26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M9.5 15.5 L21.5 25.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9.5 15.5 L23 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="23" cy="6.5" r="2.6" fill="currentColor"/>
      <circle cx="23" cy="6.5" r="5.2" stroke="currentColor" stroke-width="1" opacity="0.4"/>
    </svg>
  </div>

  <!-- Horizontal wordmark, light -->
  <div class="lockup">
    <span class="lockup-label">Horizontal wordmark · light</span>
    <div class="wordmark">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M9.5 6 V26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M9.5 15.5 L21.5 25.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.5 15.5 L23 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="23" cy="6.5" r="2.6" fill="currentColor"/>
        <circle cx="23" cy="6.5" r="5.2" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      </svg>
      <span>Krengel Marketing<span class="r">®</span></span>
    </div>
  </div>

  <!-- Icon-only mark, inverted -->
  <div class="lockup mark-only dark">
    <span class="lockup-label">Primary mark · dark / inverted</span>
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M9.5 6 V26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M9.5 15.5 L21.5 25.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9.5 15.5 L23 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="23" cy="6.5" r="2.6" fill="currentColor"/>
      <circle cx="23" cy="6.5" r="5.2" stroke="currentColor" stroke-width="1" opacity="0.4"/>
    </svg>
  </div>

  <!-- Horizontal wordmark, dark -->
  <div class="lockup dark">
    <span class="lockup-label">Horizontal wordmark · dark</span>
    <div class="wordmark dark">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M9.5 6 V26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M9.5 15.5 L21.5 25.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.5 15.5 L23 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="23" cy="6.5" r="2.6" fill="currentColor"/>
        <circle cx="23" cy="6.5" r="5.2" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      </svg>
      <span>Krengel Marketing<span class="r">®</span></span>
    </div>
  </div>

  <!-- Stacked / vertical lockup -->
  <div class="lockup">
    <span class="lockup-label">Stacked lockup</span>
    <div class="stacked">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M9.5 6 V26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M9.5 15.5 L21.5 25.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.5 15.5 L23 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="23" cy="6.5" r="2.6" fill="currentColor"/>
        <circle cx="23" cy="6.5" r="5.2" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      </svg>
      <span class="name">Krengel Marketing</span>
    </div>
  </div>

  <!-- Favicon badge (the rounded square version) -->
  <div class="lockup">
    <span class="lockup-label">App icon / favicon</span>
    <img src="favicon.svg" width="200" height="200" alt="Krengel Marketing favicon" />
  </div>
</div>

</body>
</html>
